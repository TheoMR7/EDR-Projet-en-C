# Configuration des seuils du moteur de regles
# ---------------------------------------------
# syn_scan_threshold       : nombre de paquets SYN sans ACK retenu pour un scan.
# dos_bytes_threshold      : volume cumule d'octets declenchant une alerte DoS.
# auto_ban_attackers       : 1 pour ajouter automatiquement les attaquants, 0 sinon.
syn_scan_threshold 5
dos_bytes_threshold 500000
auto_ban_attackers 1